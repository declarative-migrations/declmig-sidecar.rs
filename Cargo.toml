    [package]
    name = "declmig-sidecar"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "Sidecar for Declarative Migrations"
    repository = "https://github.com/declarative-migrations/declmig-sidecar.rs"

    [[bin]]
    name = "declmig-sidecar"
    path = "src/main.rs"

    [dependencies]
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"
    thiserror = "2"

[lints.rust]
unsafe_code = "forbid"


