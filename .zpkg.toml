[package]
org = "declarative-migrations"
name = "declmig-sidecar"
version = "0.1.0"
description = "Sidecar for declarative-migrations."
license = "MIT"
keywords = ["sidecar", "observability", "k8s"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/declarative-migrations/declmig-sidecar.rs"

[dependencies]
"ores-otel/ores-otel-sidecar" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin declmig-sidecar"
outputs = ["target/release/declmig-sidecar"]

[bin]
declmig-sidecar = "target/release/declmig-sidecar"

[install]
adapter = "none"

[scripts]
test = "cargo test --all-targets --locked"
